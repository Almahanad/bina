/* Layout: دفتر حسابات هادئ — بطاقة ملخّص داكنة واحدة هي محور الشاشة، وتحتها قوائم مجمّعة بخطوط شعرية
   وعناوين أقسام خارج البطاقات؛ إضافة الفاتورة بزر عائم فوق شريط التبويب */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EDF1F0; --bar:rgba(243,245,244,.88);
  --fg:#13201F; --muted:#5F6D6B; --line:#E3E8E7; --card-line:rgba(19,32,31,.04);
  --accent:#0F6B66; --accent-ink:#FFFFFF; --accent-soft:#E1EFEC;
  --hero:#0F3533; --hero-fg:#F2F7F6; --hero-muted:#A9C4C1; --hero-track:rgba(255,255,255,.14);
  --hero-accent:#7FD1C8; --hero-warn:#E8BE6A; --hero-bad:#F29A9A;
  --ok:#1D6B47; --warn:#8A5D0A; --bad:#A83232;
  --ok-bg:#E0EFE6; --warn-bg:#F7EEDB; --bad-bg:#F6E2E2;
  --shadow:0 1px 2px rgba(19,32,31,.05),0 6px 20px rgba(19,32,31,.05);
  --fab-shadow:0 8px 22px rgba(15,107,102,.30);
  --r-lg:20px; --r-md:14px;
  --font:'Plex Arabic',-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",system-ui,Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1313; --surface:#151D1C; --surface-2:#1D2726; --bar:rgba(13,19,19,.86);
  --fg:#E8EFEE; --muted:#93A3A0; --line:#243130; --card-line:#1E2928;
  --accent:#5DB6AE; --accent-ink:#06211F; --accent-soft:#17302D;
  --hero:#173B38; --hero-fg:#EEF6F5; --hero-muted:#9FC2BE; --hero-track:rgba(255,255,255,.12);
  --hero-accent:#7FD1C8; --hero-warn:#E8BE6A; --hero-bad:#F29A9A;
  --ok:#62C493; --warn:#E3B661; --bad:#F08C8C;
  --ok-bg:#14301F; --warn-bg:#33291A; --bad-bg:#3A1E1E;
  --shadow:none; --fab-shadow:0 8px 22px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1313; --surface:#151D1C; --surface-2:#1D2726; --bar:rgba(13,19,19,.86);
  --fg:#E8EFEE; --muted:#93A3A0; --line:#243130; --card-line:#1E2928;
  --accent:#5DB6AE; --accent-ink:#06211F; --accent-soft:#17302D;
  --hero:#173B38; --hero-fg:#EEF6F5; --hero-muted:#9FC2BE; --hero-track:rgba(255,255,255,.12);
  --hero-accent:#7FD1C8; --hero-warn:#E8BE6A; --hero-bad:#F29A9A;
  --ok:#62C493; --warn:#E3B661; --bad:#F08C8C;
  --ok-bg:#14301F; --warn-bg:#33291A; --bad-bg:#3A1E1E;
  --shadow:none; --fab-shadow:0 8px 22px rgba(0,0,0,.45);
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums lining-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── ترويسة ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.top-in{padding-block:14px 10px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted)}
.top h1{font-size:27px;font-weight:600;line-height:1.2;text-wrap:balance}

/* ── محتوى ── */
main{padding-block:4px calc(156px + env(safe-area-inset-bottom,0px))}
main>section{display:flex;flex-direction:column;gap:12px}

/* بطاقة الملخّص */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:var(--r-lg);padding:20px 20px 18px;
  display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--hero-muted)}
.hero-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:-6px}
.hero-num .amt{font-size:40px;font-weight:600;line-height:1.05}

<script>
(function(){
"use strict";

/* ══════════ التخزين ══════════ */
var KEY="bina_v1", S=null;
var DEFAULTS={
  settings:{project:"بناء منزل",currency:"ر.ع",vat:0.05,cap:null,seeded:true},
  lists:{
    categories:["مواد بناء","حديد تسليح","أسمنت وخرسانة جاهزة","أعمال كهربائية","أعمال صحية وسباكة","نجارة وألمنيوم","دهانات وتشطيبات","بلاط وأرضيات","عمالة ومقاولات","معدات ونقل","رسوم ومعاملات","أخرى"],
    stages:["الحفر والأساسات","الهيكل الخرساني","البناء والطابوق","التمديدات","التشطيبات الداخلية","الأعمال الخارجية","عام / غير محدد"],
    methods:["نقدًا","تحويل بنكي","شيك","بطاقة","آجل"],
    units:["حبة","متر مكعب","متر مربع","متر طولي","طن","كيلوغرام","كيس","لتر","لفة","مقطوعية","يوم عمل"]
  },
  suppliers:[],
  invoices:[],
  payments:[],
  budgets:{},
  atts:{}
};

function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); if(fix()) save(); return; } }catch(e){}
  S=JSON.parse(JSON.stringify(DEFAULTS));
  save();
}
function fix(){
  var d=DEFAULTS;
  if(!S||typeof S!=="object") S=JSON.parse(JSON.stringify(d));
  S.settings=Object.assign({},d.settings,S.settings||{});
  S.lists=Object.assign({},d.lists,S.lists||{});
  ["invoices","payments","suppliers"].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=[]; });
  if(!S.budgets||typeof S.budgets!=="object") S.budgets={};
  if(!S.atts||typeof S.atts!=="object") S.atts={};
  var changed=false;
  S.invoices.forEach(function(v){
    if(!Array.isArray(v.items)) v.items=[];
    if(!Array.isArray(v.atts)){ v.atts=v.photo?[v.photo]:[]; changed=true; }
    if("photo" in v){ delete v.photo; changed=true; }
  });
  return changed;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("تعذّر الحفظ — مساحة المتصفح ممتلئة. صدّر نسخة احتياطية."); }
}
function uid(){ return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function dataURLToBlob(u){
  var parts=String(u).split(","), m=/data:([^;]+)/.exec(parts[0]);
  var bin=atob(parts[1]||""), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:m?m[1]:"application/octet-stream"});
}
function daysSince(d){
  if(!d) return null;
  var a=new Date(d+"T00:00:00"), b=new Date(), ms=b-a;
  return ms<0?0:Math.floor(ms/86400000);
}
function markBackup(){ S.settings.lastBackup=today(); save(); }
function nextNo(base){
  var m=/^(.*?)(\d+)\s*$/.exec(base||"");
  if(!m) return "";
  var pre=m[1], w=m[2].length, num=parseInt(m[2],10), i, cand;
  for(i=num+1;i<num+2000;i++){
    cand=String(i); while(cand.length<w) cand="0"+cand;
    cand=pre+cand;
    if(!S.invoices.some(function(v){ return v.no===cand; })) return cand;
  }
  return "";
}

/* ══════════ صور الفواتير (IndexedDB) ══════════ */
var IDB=null;
function idb(){
  if(IDB) return IDB;
  IDB=new Promise(function(res){
    try{
      var r=indexedDB.open("bina_photos",1);
      r.onupgradeneeded=function(){ r.result.createObjectStore("p"); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
  return IDB;
}
/* المرفقات تُحفظ نصًّا (data URL) لا Blob: سفاري قد يعجز عن قراءة Blob المخزّن بعد إعادة فتح الصفحة */
function idbPut(id,val){
  return idb().then(function(db){ if(!db) return null;
    return new Promise(function(res){
      try{ var t=db.transaction("p","readwrite"); t.objectStore("p").put(val,id);
        t.oncomplete=function(){res(id)}; t.onerror=function(){res(null)}; }catch(e){res(null)}
    });
  });
}
function idbGet(id){
  return idb().then(function(db){ if(!db||!id) return null;
    return new Promise(function(res){
      try{ var q=db.transaction("p","readonly").objectStore("p").get(id);
        q.onsuccess=function(){res(q.result||null)}; q.onerror=function(){res(null)}; }catch(e){res(null)}
    });
  });
}
function putAttURL(id,durl){
  var m=/^data:([^;,]+)/.exec(durl||"");
  return idbPut(id,{v:2,t:m?m[1]:"",d:durl});
}
function putPhoto(id,blob){
  return blobToDataURL(blob).then(function(u){ return putAttURL(id,u); })
    .catch(function(){ return null; });
}
/* يعيد {d,t,size} أو {broken:true} أو null */
function getAtt(id){
  return idbGet(id).then(function(r){
    if(!r) return null;
    if(typeof r==="object"&&r.v===2&&typeof r.d==="string")
      return {d:r.d,t:r.t||"",size:Math.round(r.d.length*0.75)};
    if(typeof Blob!=="undefined"&&r instanceof Blob){
      return blobToDataURL(r).then(function(u){
        return putAttURL(id,u).then(function(){ return {d:u,t:r.type||"",size:r.size}; });
      }).catch(function(){ return {broken:true}; });
    }
    return {broken:true};
  });
}
function getPhoto(id){
  return getAtt(id).then(function(a){ return (a&&a.d)?dataURLToBlob(a.d):null; });
}
function migrateAtts(){
  var ids=[];
  S.invoices.forEach(function(v){ (v.atts||[]).forEach(function(a){ if(ids.indexOf(a)<0) ids.push(a); }); });
  var seq=Promise.resolve();
  ids.forEach(function(a){ seq=seq.then(function(){ return getAtt(a); }); });
  return seq;
}
function attExt(t,isPdf){
  if(isPdf) return ".pdf";
  if(/png/.test(t)) return ".png";
  if(/webp/.test(t)) return ".webp";
  if(/gif/.test(t)) return ".gif";
  return ".jpg";
}
function delPhoto(id){
  return idb().then(function(db){ if(!db||!id) return;
    try{ db.transaction("p","readwrite").objectStore("p").delete(id); }catch(e){}
  });
}
function shrink(file){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1400, w=img.width, h=img.height, s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      if(c.toBlob) c.toBlob(function(b){ res(b||file); },"image/jpeg",0.72);
      else res(file);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

/* ══════════ حساب ══════════ */
function n(v){ var x=parseFloat(v); return isFinite(x)?x:0; }
function r3(x){ return Math.round(x*1000)/1000; }
function fmt(x){
  var neg=x<0; x=Math.abs(r3(x));
  var p=x.toFixed(3).split("."), i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"−":"")+i+"."+p[1];
}
function money(x){ return fmt(x)+" "+S.settings.currency; }
function qty(x){ var v=r3(n(x)), p=String(v).split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,","); return p.join("."); }
function pct(x){ return (Math.round(x*1000)/10).toFixed(1)+"%"; }
function today(){ return new Date().toISOString().slice(0,10); }

function invNet(v){
  if(v.items&&v.items.length) return r3(v.items.reduce(function(a,it){ return a+r3(n(it.q)*n(it.p)); },0));
  return r3(n(v.net));
}
function invVat(v){ return r3(invNet(v)*(v.vatRate==null?S.settings.vat:n(v.vatRate))); }
function invTotal(v){ return r3(invNet(v)+invVat(v)); }
function invPaid(v){ return r3(S.payments.filter(function(p){return p.inv===v.id}).reduce(function(a,p){return a+n(p.amount)},0)); }
function invRest(v){ return r3(invTotal(v)-invPaid(v)); }
function invStatus(v){
  var rest=invRest(v), paid=invPaid(v);
  if(invTotal(v)===0) return {t:"بلا مبلغ",c:"p-mute"};
  if(rest<=0) return {t:"مدفوعة",c:"p-ok"};
  if(v.due&&v.due<today()) return {t:"متأخرة",c:"p-bad"};
  if(paid>0) return {t:"مدفوعة جزئيًا",c:"p-warn"};
  return {t:"غير مدفوعة",c:"p-mute"};
}
function totals(){
  var t={net:0,vat:0,total:0,paid:0,rest:0,late:0,lateAmt:0,unpaid:0};
  S.invoices.forEach(function(v){
    t.net+=invNet(v); t.vat+=invVat(v); t.total+=invTotal(v);
    t.paid+=invPaid(v); t.rest+=invRest(v);
    var st=invStatus(v).t;
    if(st==="متأخرة"){ t.late++; t.lateAmt+=invRest(v); }
    if(st==="غير مدفوعة") t.unpaid++;
  });
  Object.keys(t).forEach(function(k){ t[k]=r3(t[k]); });
  return t;
}
function catSpend(c){ return r3(S.invoices.filter(function(v){return v.category===c}).reduce(function(a,v){return a+invTotal(v)},0)); }
function budgetSum(){ return r3(Object.keys(S.budgets).reduce(function(a,k){return a+n(S.budgets[k])},0)); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function el(id){ return document.getElementById(id); }
var toastTimer=null;
function toast(msg){
  var t=el("toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.hidden=true; },2600);
}
function opts(arr,sel){
  return '<option value=""></option>'+arr.map(function(o){
    return '<option value="'+esc(o)+'"'+(o===sel?" selected":"")+">"+esc(o)+"</option>"; }).join("");
}

  ["home","inv","bud","more"].forEach(function(k){ el("s-"+k).hidden=(k!==tab); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){

  try{ localStorage.setItem(KEY+"_tab",tab); }catch(e){}
}

function amtHTML(x){
  var p=fmt(x).split(".");
  return '<span class="amt num" dir="ltr">'+esc(p[0])+'<i>.'+esc(p[1]||"000")+'</i></span>';
}
function fmt0(x){
  x=r3(n(x));
  if(Math.round(x)===x) return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return fmt(x);
}
function countLabel(c){
  if(c===0) return "لا فواتير";
  if(c===1) return "فاتورة واحدة";
  if(c===2) return "فاتورتان";
  if(c<=10) return c+" فواتير";
  return c+" فاتورة";
}

function saveInvoice(id){
  var b=el("sheetBody"), isNew=b.dataset.editing==="new";
  var items=JSON.parse(b.dataset.vitems||"[]");
  var no=el("f-no").value.trim();
  if(!no){ toast("اكتب رقم الفاتورة أولًا."); el("f-no").focus(); return; }
  var dup=S.invoices.filter(function(x){return x.no===no&&x.id!==id});
  if(dup.length){ toast("رقم الفاتورة مستخدم في فاتورة أخرى."); return; }
  var v={id:id,no:no,date:el("f-date").value,supplier:el("f-sup").value.trim(),
    category:el("f-cat").value,stage:el("f-stage").value,
    net:items.length?null:(el("f-net").value===""?null:n(el("f-net").value)),
    vatRate:el("f-vat").value===""?S.settings.vat:n(el("f-vat").value),
    due:el("f-due").value,method:el("f-method").value,note:el("f-note").value.trim(),
    items:items,atts:JSON.parse(b.dataset.vatts||"[]")};
  if(b.dataset.vexample) v.example=true;
  if(isNew) S.invoices.push(v);
  else S.invoices=S.invoices.map(function(x){ return x.id===id?v:x; });

    S.suppliers.push({id:uid(),name:v.supplier,tax:"",phone:"",note:""}); save();
  }
  toast("حُفظت الفاتورة.");
  invoiceDetail(id);
}

function viewAtt(vid,aid){
  var meta=S.atts[aid]||{k:"img",n:""};
  getAtt(aid).then(function(a){
    if(!a||a.broken){ toast("تعذّرت قراءة المرفق — احذفه وأعد إرفاقه."); return; }
    var isPdf=(a.t.indexOf("pdf")>-1)||meta.k==="pdf";
    var base=(meta.n||"مرفق").replace(/\.[A-Za-z0-9]{2,5}$/,"");
    saveFile(base+attExt(a.t,isPdf), dataURLToBlob(a.d), a.t||(isPdf?"application/pdf":"image/jpeg"),
      isPdf?null:[a.d],
      {title:isPdf?"ملف مرفق":"صورة مرفقة", view:!isPdf, prebuilt:a.d,
       back:function(){ invoiceDetail(vid); }});
  });
}
function storeAtt(v,f){
  var isPdf=((f.type||"").indexOf("pdf")>-1)||/\.pdf$/i.test(f.name||"");
  if(f.size>20*1024*1024){ toast("تُخطّي «"+(f.name||"ملف")+"» — أكبر من ٢٠ ميغابايت."); return Promise.resolve(); }
  return (isPdf?Promise.resolve(f):shrink(f)).then(function(b){
    var pid=uid();
    return putPhoto(pid,b).then(function(ok){
      if(!ok){ toast("تعذّر حفظ «"+(f.name||"ملف")+"»."); return; }
      if(!Array.isArray(v.atts)) v.atts=[];
      v.atts.push(pid);
      S.atts[pid]={k:isPdf?"pdf":"img",n:f.name||""};
    });
  });
}

function csvCell(x){ var s=String(x==null?"":x); return '"'+s.replace(/"/g,'""')+'"'; }

  S.invoices.forEach(function(v){

}
var IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
  (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var LAST=null;

function blobToDataURL(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(String(fr.result)); };
    fr.onerror=function(){ rej(); };
    fr.readAsDataURL(blob);
  });
}
function canShareFile(){
  try{
    return !!(navigator.canShare && navigator.share &&
      navigator.canShare({files:[new File([LAST.blob],LAST.name,{type:LAST.mime})]}));
  }catch(e){ return false; }
}
function saveFile(filename,text,mime,pageImgs,opts){
  opts=opts||{};
  var blob=(text instanceof Blob)?text:new Blob([text],{type:mime});
  (opts.prebuilt?Promise.resolve(opts.prebuilt):blobToDataURL(blob)).then(function(durl){
    if(LAST&&LAST.url){ try{ URL.revokeObjectURL(LAST.url); }catch(e){} }
    LAST={name:filename,blob:blob,mime:mime,b64:durl,url:URL.createObjectURL(blob)};
    deliverSheet(pageImgs,opts);
  }).catch(function(){ toast("تعذّر تجهيز الملف."); });
}
function deliverSheet(pageImgs,opts){
  opts=opts||{};
  if(opts.view&&pageImgs&&pageImgs.length){
    var share0=canShareFile();
    var hv='<img class="thumb" src="'+pageImgs[0]+'" alt="الصورة المرفقة">'+
      '<div class="note">كبّرها بإصبعين. لحفظها في ألبوم الصور: اضغط عليها مطوّلًا ثم «حفظ في الصور».</div>'+
      '<div class="actions">'+
      (share0?'<button class="primary" type="button" data-sharefile="1">مشاركة · حفظ</button>':"")+
      '<button class="ghost" type="button" data-dlfile="1">تنزيل</button></div>';
    openSheet(opts.title||"صورة مرفقة",hv,null,opts.back||null);
    return;
  }
  var kb=Math.round(LAST.blob.size/1024);
  var share=canShareFile();

/* ══════════ تصدير PDF ══════════ */
/* الصفحة تُرسم على canvas (فيرسم المتصفح العربية بشكلها الصحيح) ثم تُغلَّف في PDF
   نبنيه بأنفسنا — بلا أي مكتبة خارجية، فيعمل بدون إنترنت. */
var PW=1240, PH=1754, PM=72;
var P_INK="#16262E", P_MUT="#5A6B74", P_LINE="#D6DFE2", P_TEAL="#0E3B42", P_SOFT="#F1F4F5", P_CLAY="#A3522A";

function pFont(size,weight){ return (weight||400)+" "+size+'px -apple-system,"SF Arabic","Segoe UI",system-ui,Tahoma,sans-serif'; }
function newPage(){
  var c=document.createElement("canvas"); c.width=PW; c.height=PH;
  var g=c.getContext("2d");
  g.fillStyle="#FFFFFF"; g.fillRect(0,0,PW,PH);
  g.textBaseline="middle"; g.direction="rtl";
  return {c:c,g:g,y:PM};
}
function txt(p,str,size,o){
  o=o||{}; var g=p.g;
  g.font=pFont(size,o.w); g.fillStyle=o.c||P_INK;
  g.textAlign=o.align||"right";
  g.direction=o.dir||(o.align==="left"?"ltr":"rtl");
  var px=o.x!=null?o.x:(o.align==="left"?PM:(o.align==="center"?PW/2:PW-PM));
  g.fillText(str==null?"":String(str), px, o.y!=null?o.y:p.y);
}
function clipTxt(g,str,size,maxw,weight){
  g.font=pFont(size,weight); str=String(str==null?"":str);
  if(g.measureText(str).width<=maxw) return str;
  while(str.length>1 && g.measureText(str+"…").width>maxw) str=str.slice(0,-1);
  return str+"…";
}
function rrect(g,a,b,w,h,r){
  g.beginPath(); g.moveTo(a+r,b);
  g.arcTo(a+w,b,a+w,b+h,r); g.arcTo(a+w,b+h,a,b+h,r);
  g.arcTo(a,b+h,a,b,r); g.arcTo(a,b,a+w,b,r); g.closePath();
}
function pRule(p,y){ p.g.strokeStyle=P_LINE; p.g.lineWidth=1; p.g.beginPath(); p.g.moveTo(PM,y+0.5); p.g.lineTo(PW-PM,y+0.5); p.g.stroke(); }
function pHeader(p,title,sub){
  p.g.fillStyle=P_TEAL; p.g.fillRect(0,0,PW,12);
  txt(p,S.settings.project||"مشروع البناء",24,{y:PM-6,c:P_CLAY,w:600});
  txt(p,title,46,{y:PM+42,w:700});
  if(sub) txt(p,sub,26,{y:PM+94,c:P_MUT});
  p.y=PM+(sub?140:112);
}
function pFooter(p,i,total){
  txt(p,"صفحة "+i+" من "+total,20,{y:PH-52,c:P_MUT,align:"center"});
  txt(p,"دفتر بناء · "+today(),20,{y:PH-52,c:P_MUT});
}
function kvBox(p,rows){
  var h=rows.length*46+30;
  p.g.fillStyle=P_SOFT; rrect(p.g,PM,p.y,PW-2*PM,h,14); p.g.fill();
  var yy=p.y+30;
  rows.forEach(function(r){
    txt(p,r[0],24,{y:yy,c:P_MUT,x:PW-PM-26});
    txt(p,r[1],26,{y:yy,w:600,align:"left",x:PM+26});
    yy+=46;
  });
  p.y+=h+34;
}
function pTable(st,cols,rows){
  function head(){
    var p=st.p, y=p.y;
    p.g.fillStyle=P_TEAL; rrect(p.g,PM,y,PW-2*PM,50,8); p.g.fill();
    var rx=PW-PM-16;
    cols.forEach(function(c){
      txt(p,clipTxt(p.g,c.t,20,c.w-14,600),20,{y:y+25,w:600,c:"#FFFFFF",dir:"rtl",
        x:c.align==="left"?rx-c.w+14:rx, align:c.align==="left"?"left":"right"});
      rx-=c.w;
    });
    p.y=y+50;
  }
  head();
  rows.forEach(function(r){
    if(st.p.y+46>PH-110){ st.p=st.next(); head(); }
    var p=st.p, y=p.y, rx=PW-PM-16;
    cols.forEach(function(c,i){
      txt(p,clipTxt(p.g,r[i],20,c.w-14,c.bold?600:400),20,{y:y+23,w:c.bold?600:400,
        x:c.align==="left"?rx-c.w+14:rx, align:c.align==="left"?"left":"right"});
      rx-=c.w;
    });
    pRule(p,y+46); p.y=y+46;
  });
  st.p.y+=30;
}
function sectionTitle(st,t){
  if(st.p.y+120>PH-110) st.p=st.next();
  txt(st.p,t,30,{w:700}); st.p.y+=46;
}

function b64bytes(dataURL){
  var bin=atob(dataURL.split(",")[1]), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function pdfBlob(imgs){
  var enc=new TextEncoder(), chunks=[], len=0, offs=[];
  function put(x){ var b=(typeof x==="string")?enc.encode(x):x; chunks.push(b); len+=b.length; }
  function obj(num,dict,stream){
    offs[num]=len; put(num+" 0 obj\n"+dict+"\n");
    if(stream){ put("stream\n"); put(stream); put("\nendstream\n"); }
    put("endobj\n");
  }
  put(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  var N=imgs.length, kids=[], i;
  for(i=0;i<N;i++) kids.push((3+i*3)+" 0 R");
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+N+" >>");
  var pw="595.276", ph="841.890";
  for(i=0;i<N;i++){
    var pn=3+i*3, cn=4+i*3, xn=5+i*3, im=imgs[i];
    obj(pn,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] "+
      "/Resources << /XObject << /Im0 "+xn+" 0 R >> >> /Contents "+cn+" 0 R >>");
    var csb=enc.encode("q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q");
    obj(cn,"<< /Length "+csb.length+" >>",csb);
    obj(xn,"<< /Type /XObject /Subtype /Image /Width "+im.w+" /Height "+im.h+
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+im.data.length+" >>",im.data);
  }
  var total=2+N*3, xo=len;
  put("xref\n0 "+(total+1)+"\n0000000000 65535 f \n");
  for(var k=1;k<=total;k++) put(("0000000000"+offs[k]).slice(-10)+" 00000 n \n");
  put("trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xo+"\n%%EOF\n");
  var out=new Uint8Array(len), pos=0;
  chunks.forEach(function(b){ out.set(b,pos); pos+=b.length; });
  return new Blob([out],{type:"application/pdf"});
}
function pagesToPdf(pages,filename){
  pages.forEach(function(p,i){ pFooter(p,i+1,pages.length); });
  var urls=pages.map(function(p){ return p.c.toDataURL("image/jpeg",0.86); });
  var imgs=urls.map(function(u){ return {data:b64bytes(u),w:PW,h:PH}; });
  saveFile(filename,pdfBlob(imgs),"application/pdf",urls);
}

              ["المدفوع",fmt(invPaid(v))],["المتبقي",fmt(invRest(v))]]);

  if(pays.length){

  var finish=function(){ pagesToPdf(pages,"فاتورة-"+(v.no||"بلا-رقم")+".pdf"); };
  var atts=v.atts||[];
  if(!atts.length) return finish();
  var pdfNames=atts.filter(function(a){ return (S.atts[a]||{}).k==="pdf"; })
                   .map(function(a){ return (S.atts[a]||{}).n||"ملف PDF"; });
  if(pdfNames.length){
    if(st.p.y+110>PH-110) st.p=st.next();
    txt(st.p,"مرفقات PDF",26,{w:700}); st.p.y+=38;
    pdfNames.forEach(function(nm){
      txt(st.p,clipTxt(st.p.g,"• "+nm+" — محفوظ داخل التطبيق ولم يُدمج هنا.",22,PW-2*PM,400),22,{c:P_MUT});
      st.p.y+=32;
      if(st.p.y>PH-130) st.p=st.next();
    });
  }
  var imgIds=atts.filter(function(a){ return (S.atts[a]||{k:"img"}).k!=="pdf"; });
  if(!imgIds.length) return finish();
  var ix=0;
  (function nextImg(){
    if(ix>=imgIds.length) return finish();
    var aid=imgIds[ix++];
    getAtt(aid).then(function(a){
      if(!a||!a.d) return nextImg();
      var img=new Image();
      img.onload=function(){
        var q=newPage(); pages.push(q);
        pHeader(q,"مرفق الفاتورة",(v.no||"")+" — "+ix+" من "+imgIds.length);
        var maxW=PW-2*PM, maxH=PH-q.y-110;
        var sc=Math.min(maxW/img.width,maxH/img.height);
        q.g.drawImage(img,(PW-img.width*sc)/2,q.y,img.width*sc,img.height*sc);
        nextImg();
      };
      img.onerror=function(){ nextImg(); };
      img.src=a.d;
    });
  })();
}

function collectAtts(){
  var ids=[];
  S.invoices.forEach(function(v){ (v.atts||[]).forEach(function(a){ if(ids.indexOf(a)<0) ids.push(a); }); });
  var files={}, seq=Promise.resolve();
  ids.forEach(function(a){
    seq=seq.then(function(){
      return getAtt(a).then(function(r){ if(r&&r.d) files[a]=r.d; });
    });
  });
  return seq.then(function(){ return files; });
}
function fullBackup(){
  toast("جارٍ تجهيز النسخة الكاملة…");
  collectAtts().then(function(files){
    markBackup();
    var payload=JSON.parse(JSON.stringify(S));
    payload.attFiles=files;
    saveFile("نسخة-كاملة-دفتر-بناء.json",JSON.stringify(payload),"application/json");
  });
}
function restoreFiles(files,idMap){
  var ks=Object.keys(files||{});
  if(!ks.length) return Promise.resolve(0);
  var seq=Promise.resolve(), ok=0;
  ks.forEach(function(k){
    seq=seq.then(function(){
      if(idMap&&!idMap[k]) return;
      var target=(idMap&&idMap[k])||k;
      return putAttURL(target,files[k]).then(function(r){ if(r) ok++; });
    });
  });
  return seq.then(function(){ return ok; });
}

      'placeholder="اضغط مطوّلًا ثم «لصق» بعد أن تنسخ من التطبيق الآخر"></textarea></label>'+
    '<label class="f">أو اختر ملف النسخة<input id="imp-f" type="file"></label>'+
    '<div class="note">لم تجد الملف؟ في تطبيق «الملفات» افتح تبويب <b>«الأخيرة»</b>، أو مجلد <b>«التنزيلات»</b>. '+
      'وقد يكون اسمه «Unknown» أو «document» بدل اسمه الأصلي.</div>'+
    '<div class="actions"><button class="primary" type="button" data-doimport="merge">أضف إلى الموجود</button></div>'+
    '<div class="note">يضيف الفواتير الجديدة ويترك ما عندك كما هو، ويتخطّى أي فاتورة برقم موجود مسبقًا.</div>'+
    '<div class="warnbox">البديل أدناه <b>يمحو كل بياناتك الحالية</b> ويضع مكانها محتوى الملف. صدّر نسخة أولًا.</div>'+
    '<div class="actions"><button class="ghost danger" type="button" data-doimport="replace">استبدل كل شيء</button></div>';
  openSheet("استيراد نسخة احتياطية",h,function(){
    el("imp-f").addEventListener("change",function(){
      var f=this.files&&this.files[0]; if(!f) return;
      var fr=new FileReader();
      fr.onload=function(){ el("imp-t").value=String(fr.result||""); toast("قُرئ الملف — اضغط استورد."); };
      fr.readAsText(f);
    });
  });
}
function doImport(mode){
  var txt=el("imp-t").value.trim();
  if(!txt){ toast("اختر ملفًا أو ألصق النص أولًا."); return; }
  var data;
  try{ data=JSON.parse(txt); }catch(e){ toast("الملف ليس نسخة صالحة."); return; }
  if(!data||!Array.isArray(data.invoices)){ toast("الملف ليس نسخة من هذا التطبيق."); return; }
  if(mode!=="merge"){
    var rf=data.attFiles||{}; delete data.attFiles;
    S=data; fix(); save();
    restoreFiles(rf,null).then(function(okn){
      closeSheet(); toast("استُعيدت النسخة"+(okn?(" مع "+okn+" مرفقًا"):"")+".");
    });
    return;
  }

  var have={}; S.invoices.forEach(function(v){ if(v.no) have[v.no]=1; });
  var added=0, skipped=0, idMap={}, wasEmpty=!S.invoices.length;
  (data.invoices||[]).forEach(function(v){
    if(v.no&&have[v.no]){ skipped++; return; }
    var oldId=v.id, nid=uid();
    v.id=nid; delete v.photo;
    var keep=[];
    (v.atts||[]).forEach(function(oa){
      if(!(data.attFiles&&data.attFiles[oa])) return;
      var na=uid(); idMap[oa]=na;
      if(data.atts&&data.atts[oa]) S.atts[na]=data.atts[oa];
      keep.push(na);
    });
    v.atts=keep;
    S.invoices.push(v); if(v.no) have[v.no]=1; added++;
    (data.payments||[]).forEach(function(pm){
      if(pm.inv!==oldId) return;
      S.payments.push({id:uid(),inv:nid,amount:n(pm.amount),date:pm.date||"",
        method:pm.method||"",ref:pm.ref||""});
    });
  });
  (data.suppliers||[]).forEach(function(sp){
    if(!sp||!sp.name) return;
    if(S.suppliers.some(function(x){ return x.name===sp.name; })) return;
    S.suppliers.push({id:uid(),name:sp.name,tax:sp.tax||"",phone:sp.phone||"",note:sp.note||""});
  });
  ["categories","stages","methods","units"].forEach(function(k){
    (((data.lists||{})[k])||[]).forEach(function(x){
      if(S.lists[k].indexOf(x)<0) S.lists[k].push(x); });
  });
  Object.keys(data.budgets||{}).forEach(function(c){
    if(S.budgets[c]==null) S.budgets[c]=data.budgets[c]; });
  // الإعدادات: في تطبيق جديد فارغ تُؤخذ كلها من النسخة، وإلا يُملأ سقف الميزانية فقط إن كان فارغًا
  var ds=data.settings||{};
  if(wasEmpty){
    ["project","currency","vat","lastBackup"].forEach(function(k){
      if(ds[k]!=null&&ds[k]!=="") S.settings[k]=ds[k]; });
  }
  if((S.settings.cap==null||S.settings.cap==="")&&ds.cap!=null) S.settings.cap=ds.cap;
  fix(); save();
  restoreFiles(data.attFiles||{},idMap).then(function(){
    closeSheet();
    toast("أُضيفت "+added+" فاتورة"+(skipped?(" · تُخطّيت "+skipped+" مكررة"):"")+".");
  });
}

/* ══════════ الأحداث ══════════ */
document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-tab],[data-go],[data-open],[data-act],[data-filter],[data-save],[data-del],[data-edit],[data-pay],[data-item],[data-saveitem],[data-savepay],[data-delitem],[data-delpay],[data-delsup],[data-savesup],[data-dellist],[data-savelist],[data-savesettings],[data-savebud],[data-exp],[data-copy],[data-doimport],[data-delatt],[data-invpdf],[data-pdf],[data-sharefile],[data-dlfile],[data-dup],[data-edititem],[data-editpay],[data-viewatt],[data-gofilter],[data-new]"):null;
  if(!t) return;
  var d=t.dataset;
  if(d.tab){ show(d.tab); return; }
  if(d.gofilter){ invFilter=d.gofilter; show("inv"); return; }
  if(d.new){ invoiceForm(null); return; }
  if(d.go){ show(d.go); return; }
  if(d.filter){ invFilter=d.filter; renderInv(); return; }
  if(d.open){ invoiceDetail(d.open); return; }
  if(d.edit){ invoiceForm(d.edit); return; }
  if(d.pay){ payForm(d.pay); return; }
  if(d.item){ itemForm(d.item); return; }
  if(d.save){ saveInvoice(d.save); return; }
  if(d.del){ deleteInvoice(d.del); return; }
  if(d.saveitem){ saveItem(d.saveitem,d.idx); return; }
  if(d.savepay){ savePay(d.savepay,d.pid||""); return; }
  if(d.viewatt&&d.vid){ viewAtt(d.vid,d.viewatt); return; }
  if(d.edititem!=null&&d.vid){ itemForm(d.vid,d.edititem); return; }
  if(d.editpay&&d.vid){ payForm(d.vid,d.editpay); return; }
  if(d.dup){
    var src=S.invoices.filter(function(x){return x.id===d.dup})[0];
    if(src) invoiceForm(null,{id:uid(),no:nextNo(src.no),date:today(),supplier:src.supplier,
      category:src.category,stage:src.stage,net:null,vatRate:src.vatRate,due:"",
      method:src.method,note:"",items:[],atts:[]});
    return;
  }
  if(d.delitem!=null&&d.vid){
    var v=S.invoices.filter(function(x){return x.id===d.vid})[0];
    if(v){ v.items.splice(parseInt(d.delitem,10),1); save(); invoiceDetail(d.vid); } return;
  }
  if(d.delpay){ S.payments=S.payments.filter(function(p){return p.id!==d.delpay}); save(); invoiceDetail(d.vid); return; }
  if(d.delatt&&d.vid){
    var iv=S.invoices.filter(function(x){return x.id===d.vid})[0];
    if(iv){
      delPhoto(d.delatt); delete S.atts[d.delatt];
      iv.atts=(iv.atts||[]).filter(function(a){ return a!==d.delatt; });
      save(); invoiceDetail(d.vid);
    }
    return;
  }
  if(d.delsup){ S.suppliers=S.suppliers.filter(function(s){return s.id!==d.delsup}); save(); suppliersSheet(); return; }
  if(d.savesup){
    var nm=el("su-n").value.trim();
    if(!nm){ toast("اكتب اسم المورد."); return; }
    S.suppliers.push({id:uid(),name:nm,tax:el("su-t").value.trim(),phone:el("su-p").value.trim(),note:""});
    save(); suppliersSheet(); toast("أُضيف المورد."); return;
  }
  if(d.dellist){ S.lists[d.dellist].splice(parseInt(d.i,10),1); save(); listSheet(d.dellist); return; }
  if(d.savelist){
    var val=el("li-v").value.trim();
    if(!val){ toast("اكتب العنصر."); return; }
    S.lists[d.savelist].push(val); save(); listSheet(d.savelist); return;
  }
  if(d.savesettings){
    S.settings.project=el("st-p").value.trim()||"مشروع البناء";
    S.settings.currency=el("st-c").value.trim()||"ر.ع";
    S.settings.vat=n(el("st-v").value);
    S.settings.cap=el("st-cap").value===""?null:n(el("st-cap").value);
    save(); closeSheet(); toast("حُفظت الإعدادات."); return;
  }
  if(d.savebud){
    S.lists.categories.forEach(function(c,i){
      var f=el("bg-"+i); if(!f) return;
      if(f.value==="") delete S.budgets[c]; else S.budgets[c]=n(f.value);
    });
    save(); closeSheet(); toast("حُفظت الميزانيات."); return;
  }
  if(d.exp){
    if(d.exp==="inv") saveFile("الفواتير.csv",invoicesCsv(),"text/csv");
    if(d.exp==="items") saveFile("بنود-الفواتير.csv",itemsCsv(),"text/csv");
    if(d.exp==="pay") saveFile("المدفوعات.csv",paymentsCsv(),"text/csv");
    if(d.exp==="json"){ markBackup(); saveFile("نسخة-دفتر-بناء.json",JSON.stringify(S),"application/json"); }
    if(d.exp==="full") fullBackup();
    return;
  }
  if(d.copy==="full"){
    // المرفقات تُقرأ بشكل غير متزامن، فنمرّر وعدًا إلى ClipboardItem داخل الضغطة نفسها (ما يشترطه سفاري)
    var full=collectAtts().then(function(files){
      markBackup();
      var payload=JSON.parse(JSON.stringify(S)); payload.attFiles=files;
      return new Blob([JSON.stringify(payload)],{type:"text/plain"});
    });
    try{
      if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
        navigator.clipboard.write([new ClipboardItem({"text/plain":full})])
          .then(function(){ toast("نُسخ كل شيء — افتح التطبيق الآخر ← المزيد ← استيراد ← ألصق."); })
          .catch(function(){ toast("تعذّر النسخ مع المرفقات — جرّب «انسخ بلا مرفقات»."); });
        return;
      }
    }catch(e){}
    toast("النسخ مع المرفقات غير متاح هنا — جرّب «انسخ بلا مرفقات».");
    return;
  }
  if(d.copy){
    var text=JSON.stringify(S);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        markBackup(); toast("نُسخ — افتح التطبيق الآخر ← المزيد ← استيراد ← ألصق."); })
        .catch(function(){ toast("تعذّر النسخ."); });
    } else toast("النسخ غير متاح هنا.");
    return;
  }
  if(d.sharefile){ shareLast(); return; }
  if(d.dlfile){ downloadLast(); return; }
  if(d.invpdf){ invoicePdf(d.invpdf); return; }
  if(d.pdf==="report"){ reportPdf(); return; }
  if(d.doimport){ doImport(d.doimport); return; }
  if(d.act){
    var a=d.act;
    if(a==="suppliers") suppliersSheet();
    else if(a.indexOf("list:")===0) listSheet(a.slice(5));
    else if(a==="settings") settingsSheet();
    else if(a==="budedit") budgetSheet();
    else if(a==="export") exportSheet();
    else if(a==="import") importSheet();
    else if(a==="clearex"){
      S.invoices.filter(function(v){return v.example}).forEach(function(v){
        (v.atts||[]).forEach(function(a){ delPhoto(a); delete S.atts[a]; }); });
      S.invoices=S.invoices.filter(function(v){return !v.example});
      save(); render(); toast("مُسحت بيانات المثال.");
    }
    return;
  }
});

  if(SHEET_BACK){ var f=SHEET_BACK; SHEET_BACK=null; f(); } else closeSheet();
});

  try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
}
})();
